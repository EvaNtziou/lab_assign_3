<!DOCTYPE html>
<html lang="en">
<link rel="stylesheet" href="easter.css">
<head>
    <meta charset="UTF-8">
    <title>Easter Celebration</title>
</head>
<body>
    <h1>Happy Easter! 🐣</h1>
    <p>Find the hidden Easter eggs on this page!</p>
    
    <div class="egg" onclick="alert('You found a chocolate egg! 🍫')"></div>
    <div class="egg" onclick="document.getElementById('secretBunny').style.display='block'"></div>
    <div class="egg" onclick="this.style.background='linear-gradient(to right, red, orange, yellow, green, blue, indigo, violet)'"></div>
    <div class="egg" onclick="this.style.background='rainbow'"></div>
    <div class="egg" onclick="this.style.background='yellow'; alert('Golden egg! 🥇')"></div>
    <div class="egg" onclick="this.style.background='green'; alert('🍀 You found the lucky egg!')"></div>
    <div class="egg" onclick="this.style.background='pink'; alert('🎀 Pink egg!')"></div>
    <div class="egg rotten" onclick="this.style.background='brown'; this.style.opacity=0.6; alert('💀 Rotten egg...')"></div>



    <p class="hidden-basket">🧺 Secret Easter Basket Found! 🧺</p>
    
    <div id="secretBunny">🐰</div>

    <script>
        // Easter egg: Konami code reveals rainbow background
        let input = '';
        const megaJumpCode = 'LFGMHAL';

        document.addEventListener('keydown', (e) => {
            input += e.key.toUpperCase();
            if (input.includes(megaJumpCode)) {
                alert("Mega Jump activated!");
                document.body.style.background = 'linear-gradient(to right, red, orange, yellow, green, blue, indigo, violet)';
            }
        });
    </script>
</body>
</html>
